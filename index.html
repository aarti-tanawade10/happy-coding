<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Cartoon Page</title>
    <style>
        body {
            background-color: #f0e7db;
            font-family: 'Comic Sans MS', 'Chalkboard SE', cursive;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .card {
            background-color: #ffffff;
            border: 4px solid #000000;
            box-shadow: 10px 10px 0px #000000;
            padding: 30px;
            max-width: 400px;
            border-radius: 20px;
            text-align: center;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background-color: #ffde59;
            border: 4px solid #000000;
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 50px;
        }

        /* The Cartoon Button */
        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 25px;
            background-color: #ff5757;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: 3px solid #000;
            border-radius: 10px;
            box-shadow: 4px 4px 0px #000;
            cursor: pointer; /* Makes it look clickable */
            outline: none;
        }

        /* Pressing effect */
        .button:active {
            box-shadow: 0px 0px 0px #000;
            transform: translate(4px, 4px);
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">ツ</div>
        <h1>Hello!</h1>
        <p>Welcome to my minimalist cartoon nook.</p>
        
        <button class="button" onclick="showMessage()">CLICK ME!</button>
    </div>

    <script>
        // This function runs when the button is clicked
        function showMessage() {
            alert("✨Happy Coding!✨");
        }
    </script>

</body>

</html>
